name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 3. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar dependencias
        run: npm install

      - name: 5. Generar la carpeta nativa de Android
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: 6. Generar Keystore temporal para firmar
        run: |
          keytool -genkey -v -keystore my-release-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=FinZen, OU=Mobile, O=FinZen, L=Bogota, ST=Bogota, C=CO" -noprompt
          mv my-release-key.keystore apps/mobile/android/app/

      - name: 7. Compilar APK Release Firmado
        working-directory: ./apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 8. Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: FinZen-APK-Release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7