name: Build Android APK (debug, manual)

# Solo manual. Este APK es de DEBUG y se firma con otra llave que el de EAS:
# no se puede instalar encima de uno compilado con EAS. Para publicar usa EAS (perfil preview/production).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 3. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar dependencias
        run: npm ci

      - name: 5. Generar la carpeta nativa
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: 6. Compilar APK (ARM64 para celulares reales)
        working-directory: ./apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: 7. Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: FinZen-APK-ARM
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7